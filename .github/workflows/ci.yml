name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # Pinned to the exact release: setup-uv has not published a floating
        # v9 major tag, only v9.0.0.
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --frozen

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Install Chromium
        # The browser binary is cached, but its system libraries are not, so
        # --with-deps still has to run on a cache hit.
        run: uv run playwright install --with-deps chromium

      - name: Run tests
        run: uv run pytest -ra

      - name: Check the JavaScript parses
        run: node --check src/public/live.js && node --check reporter/fixture.js
