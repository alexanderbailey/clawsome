name: Release

# Merging is the release button. When a push to main lands a version in
# pyproject.toml that has no tag yet, this cuts that release: tags the commit,
# publishes the GitHub release from the matching changelog section, and builds
# the image. Every other push to main is a no-op.
on:
  push:
    branches: [main]
  # Manual re-run, for a release that failed partway. The version still comes
  # from pyproject.toml, so there is only ever one source of truth.
  workflow_dispatch:

concurrency:
  # Two merges in quick succession must not race to create the same tag.
  group: release

jobs:
  release:
    name: Tag and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # create the tag and the release
      actions: write    # dispatch the image build

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # tags, so an existing one can be detected

      - name: Work out whether there is a release to cut
        id: check
        run: |
          set -euo pipefail

          version=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::pyproject.toml version must look like 1.2.3, got '$version'"
            exit 1
          fi
          tag="v$version"

          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag is already released; nothing to do." >> "$GITHUB_STEP_SUMMARY"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A new version with no notes is a mistake worth failing on: it means
          # a bump reached main without anyone saying what changed.
          pattern=$(printf '%s' "$version" | sed 's/\./\\./g')
          awk -v pat="^## \\[$pattern\\]" '
            $0 ~ pat { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md

          if [ ! -s notes.md ]; then
            echo "::error::pyproject.toml is at $version but CHANGELOG.md has no '## [$version]' section."
            exit 1
          fi

          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          {
            echo "### Releasing \`$tag\` from \`$(git rev-parse --short HEAD)\`"
            echo
            cat notes.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Tag the commit
        if: steps.check.outputs.release == 'true'
        env:
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          set -euo pipefail
          # Tagged as the bot, not as a person: CI made this tag, and the run
          # that produced it is the audit trail worth following.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"

      - name: Publish the GitHub release
        if: steps.check.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.check.outputs.tag }}
        run: gh release create "$TAG" --title "$TAG" --notes-file notes.md

      - name: Build and push the image for the tag
        if: steps.check.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.check.outputs.tag }}
        # Dispatched rather than left to the tag push above: GITHUB_TOKEN
        # pushes do not raise push events, but workflow_dispatch always starts
        # a run. Running it against the tag ref is what makes the semver and
        # `latest` tags come out right.
        run: gh workflow run publish.yml --ref "$TAG"
