[project]
name = "clawsome"
version = "0.1.6"
description = "Drive headless Chromium over a REST API and watch it live in a dashboard"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135.1",
    "jinja2>=3.1.6",
    "playwright>=1.58.0",
    "sse-starlette>=3.3.2",
    "uvicorn[standard]>=0.52.0",
]

[project.optional-dependencies]
mcp = [
    # Capped: 2.0 replaces the FastMCP server this module is written against
    # (mcp.server.fastmcp is gone, superseded by mcp.server.MCPServer), so the
    # upgrade is a rewrite rather than a bump. Tracked separately.
    "mcp>=1.2.0,<2",
    # Imported directly by src/mcp_server.py. It arrives transitively through
    # mcp today, which is not a promise mcp makes — declare what we import.
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-timeout>=2.3.0",
]

[tool.commitizen]
name = "cz_customize"
version_provider = "pep621"
tag_format = "v$version"
update_changelog_on_bump = true
annotated_tag = true
# Pre-1.0: a breaking change bumps the minor, rather than jumping to 1.0.0.
major_version_zero = true

[tool.commitizen.customize]
# Which gitmoji cut a release, and how far the version moves. A commit whose
# gitmoji is not listed here does not release at all — that is how docs, tests
# and formatting merge without producing a version nobody asked for.
bump_pattern = "^(💥|✨|🔌|🔐|📐|⏳|🖱️|🕰️|🔍|🐛|🚑|🔒|⚡️|♻️|🐳|🔧|⬆️|💄|🪵|🗑️|🔗)"

# What appears in the changelog. Wider than the bump list, so documentation
# shows up in release notes without producing a release of its own — and
# narrow enough that merge commits and chores stay out.
changelog_pattern = "^(💥|✨|🔌|🔐|📐|⏳|🖱️|🕰️|🔍|🐛|🚑|🔒|⚡️|♻️|🐳|🔧|⬆️|💄|🪵|🗑️|🔗|📝)"

# Reads the gitmoji as the change type so entries can be grouped, without
# consuming it — the lookahead leaves it in the message, so it still shows in
# the entry as well as choosing the section.
commit_parser = "^(?=(?P<change_type>💥|✨|🔌|🔐|📐|⏳|🖱️|🕰️|🔍|🐛|🚑|🔒|⚡️|♻️|🐳|🔧|⬆️|💄|🪵|🗑️|🔗|📝))(?P<message>.*)"
change_type_order = ["Breaking", "Added", "Fixed", "Changed", "Documentation"]

[tool.commitizen.customize.bump_map]
"💥" = "MAJOR"   # breaking change
"✨" = "MINOR"   # new feature
"🔌" = "MINOR"   # new integration
"🔐" = "MINOR"   # authentication
"📐" = "MINOR"   # new configuration surface
"⏳" = "MINOR"   # lifecycle behaviour
"🖱️" = "MINOR"  # new browser actions
"🕰️" = "MINOR"  # new view
"🔍" = "MINOR"   # new endpoint
"🐛" = "PATCH"   # bug fix
"🚑" = "PATCH"   # hotfix
"🔒" = "PATCH"   # security fix
"⚡️" = "PATCH"  # performance
"♻️" = "PATCH"  # refactor
"🐳" = "PATCH"   # docker
"🔧" = "PATCH"   # configuration
"⬆️" = "PATCH"  # dependency bump
"💄" = "PATCH"   # ui
"🪵" = "PATCH"   # logging
"🗑️" = "PATCH"  # removal
"🔗" = "PATCH"   # links and navigation

# Which section of the changelog each gitmoji lands in.
[tool.commitizen.customize.change_type_map]
"💥" = "Breaking"
"✨" = "Added"
"🔌" = "Added"
"🔐" = "Added"
"📐" = "Added"
"⏳" = "Added"
"🖱️" = "Added"
"🕰️" = "Added"
"🔍" = "Added"
"🐛" = "Fixed"
"🚑" = "Fixed"
"🔒" = "Fixed"
"⚡️" = "Changed"
"♻️" = "Changed"
"🐳" = "Changed"
"🔧" = "Changed"
"⬆️" = "Changed"
"💄" = "Changed"
"🪵" = "Changed"
"🗑️" = "Changed"
"🔗" = "Changed"
"📝" = "Documentation"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Every test drives a real browser, so a hang should fail rather than block CI.
timeout = 120
addopts = "-ra"
