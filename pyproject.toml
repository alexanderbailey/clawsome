[project]
name = "clawsome"
version = "0.1.0"
description = "Drive headless Chromium over a REST API and watch it live in a dashboard"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135.1",
    "jinja2>=3.1.6",
    "playwright>=1.58.0",
    "sse-starlette>=3.3.2",
    "uvicorn[standard]>=0.41.0",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-timeout>=2.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Every test drives a real browser, so a hang should fail rather than block CI.
timeout = 120
addopts = "-ra"
