{% extends "layout.html" %}
{% block content %}

<div id="conn-banner" class="conn-banner"></div>

<div id="context-list">
  {% if contexts|length == 0 %}
    <div class="empty-state">
      <p>No active browser contexts.</p>
      <p style="margin-top: 0.5rem; font-size: 0.85rem;">
        Create one via the API: <code>POST /api/contexts</code>
      </p>
    </div>
  {% else %}
    <div class="grid">
      {% for ctx in contexts %}
        {% include "partials/context_card.html" %}
      {% endfor %}
    </div>
  {% endif %}
</div>

<script>
  (function() {
    var conns = {};
    var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';

    function connectCard(card) {
      var id = card.id.replace('ctx-', '');
      if (conns[id]) return;
      var img = card.querySelector('.card-thumb');
      if (!img) return;
      conns[id] = liveScreenshot(
        proto + '//' + location.host + '/ws/screenshots/' + id,
        function(blob) {
          var url = URL.createObjectURL(blob);
          img.onload = function() { URL.revokeObjectURL(url); };
          img.src = url;
        },
        function(state) { card.setAttribute('data-conn', state); }
      );
    }

    function sync() {
      var cards = document.querySelectorAll('#context-list .card');
      var active = {};
      cards.forEach(function(card) {
        var id = card.id.replace('ctx-', '');
        active[id] = true;
        connectCard(card);
      });
      for (var id in conns) {
        if (!active[id]) {
          conns[id].close();
          delete conns[id];
        }
      }
    }

    // Merge the freshly rendered list into the page instead of replacing it.
    // Replacing would detach every <img> and kill the sockets painting them,
    // so tiles that are still present are left exactly as they are.
    function reconcile(html) {
      var list = document.getElementById('context-list');
      // A <template> is inert: parsing here does not kick off the image loads
      // that a live fragment would (each card's src hits the screenshot API).
      var tpl = document.createElement('template');
      tpl.innerHTML = html;
      var nextGrid = tpl.content.querySelector('.grid');
      var grid = list.querySelector('.grid');

      if (!nextGrid || !grid) {
        // Crossing into or out of the empty state: nothing worth preserving.
        list.replaceChildren(tpl.content);
      } else {
        var seen = {};
        nextGrid.querySelectorAll('.card').forEach(function(card) {
          seen[card.id] = true;
          if (!document.getElementById(card.id)) {
            grid.appendChild(document.importNode(card, true));
          }
        });
        grid.querySelectorAll('.card').forEach(function(card) {
          if (!seen[card.id]) card.remove();
        });
      }
      sync();
    }

    var pendingRefresh;
    function refresh() {
      // Bursts are normal (a test suite creating many contexts at once), so
      // collapse them into a single fetch.
      clearTimeout(pendingRefresh);
      pendingRefresh = setTimeout(function() {
        fetch('/partials/context-list')
          .then(function(r) { return r.text(); })
          .then(reconcile)
          .catch(function() {});
      }, 250);
    }

    sync();

    var banner = document.getElementById('conn-banner');
    liveUpdates('/sse/updates', ['context:created', 'context:destroyed'],
      function() { refresh(); },
      function(state) { banner.setAttribute('data-conn', state); },
      function() { refresh(); }   // re-sync: events during the outage are lost
    );

    // Safety net. The watchdog in live.js only notices a stream that goes
    // silent; a client whose queue overflows server-side is dropped from the
    // broadcast set while still receiving pings, so it looks healthy but never
    // gets another event. Reconciling is cheap now that it is non-destructive.
    setInterval(refresh, 15000);
  })();
</script>

{% endblock %}
