{% extends "layout.html" %}
{% block content %}

<div style="margin-bottom: 1rem;">
  <a href="{{ back_url }}">&larr; Back to {{ back_label }}</a>
  &middot;
  <a href="/context/{{ context_id }}{{ from_query }}">Live view</a>
</div>

<h2 style="margin-bottom: 1rem;">Logs &mdash; {{ context_name }}</h2>

<div id="log-status" class="conn-banner"></div>
<div class="log-container" id="log-stream">
  {% if logs|length == 0 %}
    <div class="log-entry" style="color: var(--text-muted);">No logs yet.</div>
  {% endif %}
  {% for log in logs %}
    <div class="log-entry log-{{ log.level }}">
      <span class="log-time">{{ log.created_at }}</span>
      [{{ log.level|upper }}] {{ log.message }}
    </div>
  {% endfor %}
</div>

<script>
  (function() {
    liveLogs(document.getElementById('log-stream'), '{{ context_id }}', {
      statusEl: document.getElementById('log-status'),
    });
  })();
</script>

{% endblock %}
